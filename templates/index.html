<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emotion Detection</title><style>body{font:18px system-ui;background:#f2f5fa;color:#18233d;max-width:850px;margin:70px auto;padding:25px}main{background:white;padding:40px;border-radius:16px}textarea{box-sizing:border-box;width:100%;padding:15px;font:inherit}button{padding:14px 22px;background:#2256cc;color:white;border:0;border-radius:6px;margin-top:15px}#result{line-height:1.7;margin-top:25px}</style><main><h1>Emotion Detection</h1><p>Analyze customer feedback with Watson NLP.</p><label for="text">Customer feedback</label><textarea id="text" rows="5" placeholder="Enter feedback in English"></textarea><button id="analyze">Analyze emotion</button><div id="result" role="status" aria-live="polite"></div></main><script>document.getElementById('analyze').onclick=async()=>{const result=document.getElementById('result');result.textContent='Analyzing…';try{const response=await fetch('/emotionDetector?textToAnalyze='+encodeURIComponent(document.getElementById('text').value));result.textContent=await response.text()}catch(e){result.textContent='Unable to connect. Please try again.'}};</script></html>
